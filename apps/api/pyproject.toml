[project]
name = "wearai-api"
version = "0.1.0"
description = "Backend API for the clothing store"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.4,<3",
    "pydantic[email]>=2.8,<3",
    "argon2-cffi>=23.1,<26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "httpx2>=2,<3",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
