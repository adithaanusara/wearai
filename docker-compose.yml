services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: wearai
      POSTGRES_PASSWORD: wearai
      POSTGRES_DB: wearai
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./apps/api/docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wearai -d wearai']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
